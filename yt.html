<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>yt relay</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}
iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
#tester{padding:40px;max-width:760px;margin:0 auto;line-height:1.7}
#tester input{width:100%;box-sizing:border-box;font-size:18px;padding:10px;margin:10px 0}
#tester button{font-size:18px;padding:10px 20px}
</style>
</head><body>
<script>
/* 유튜브 중계 페이지.  yt.html?v=영상ID  /  yt.html?c=채널ID(UC...)  /  &q=hd1080 (원하는 화질)
   주소에 아무것도 없으면 영상 퍼가기 테스트 화면이 나옵니다. */
(function(){
  var p = {}, qs = location.search.replace(/^\?/, '').split('&');
  for(var i = 0; i < qs.length; i++){ var kv = qs[i].split('='); if(kv[0]) p[kv[0]] = decodeURIComponent(kv[1] || ''); }

  if(!p.v && !p.c){
    var d = document.createElement('div'); d.id = 'tester';
    d.innerHTML = '<h2>유튜브 퍼가기 테스트</h2><div>유튜브 링크를 붙여넣고 [재생]을 누르세요. 영상이 나오면 skyview에서도 재생됩니다.<br>(오류 101/150이면 퍼가기가 금지된 영상입니다)</div>' +
      '<input id="u" placeholder="https://www.youtube.com/live/..."><button id="go">재생</button>';
    document.body.appendChild(d);
    document.getElementById('go').onclick = function(){
      var u = document.getElementById('u').value.trim();
      var m = u.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|live\/)|[\?&]v=)([^"&?\/\s]{11})/) || u.match(/^([\w-]{11})$/);
      var c = u.match(/(UC[\w-]{22})/);
      if(m) location.search = '?v=' + m[1]; else if(c) location.search = '?c=' + c[1]; else alert('인식할 수 없는 주소입니다');
    };
    return;
  }

  var Q = p.q || 'hd1080';
  var base = 'autoplay=1&mute=1&controls=0&rel=0&playsinline=1&enablejsapi=1&vq=' + Q + '&origin=' + encodeURIComponent(location.origin);
  var src = p.v
    ? 'https://www.youtube.com/embed/' + encodeURIComponent(p.v) + '?' + base + '&loop=1&playlist=' + encodeURIComponent(p.v)
    : 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(p.c) + '&' + base;

  var f = document.createElement('iframe');
  f.allow = 'autoplay; encrypted-media; picture-in-picture';
  f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');

  function cmd(func, args){ try { f.contentWindow.postMessage(JSON.stringify({event:'command', func:func, args:args || []}), '*'); } catch(e){} }
  function setQ(){ cmd('setPlaybackQualityRange', [Q, Q]); cmd('setPlaybackQuality', [Q]); }

  f.onload = function(){
    try { f.contentWindow.postMessage('{"event":"listening","id":1,"channel":"widget"}', '*'); } catch(e){}
    // 유튜브는 처음에 낮은 화질로 시작하므로, 여러 번 고화질을 요청한다
    [1500, 4000, 8000, 15000, 30000, 60000, 120000].forEach(function(t){ setTimeout(setQ, t); });
  };
  f.src = src; document.body.appendChild(f);

  window.addEventListener('message', function(e){
    var d = e.data; if(typeof d === 'string'){ try { d = JSON.parse(d); } catch(x){ return; } }
    if(!d) return;
    if(d.event === 'onError' && window.parent !== window) window.parent.postMessage({ ytError: d.info }, '*');
    if(d.event === 'onStateChange' && d.info === 1) setQ();          // 재생 시작될 때마다 다시 요청
  });
})();
</script>
</body></html>
