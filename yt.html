<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유튜브 최적화 중계 플레이어</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #playerWrap { position: absolute; inset: 0; width: 100%; height: 100%; }
  iframe { width: 100%; height: 100%; border: none; object-fit: cover; }
</style>
</head>
<body>

<div id="playerWrap">
  <iframe id="ytFrame" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>

<script>
function getParam(key) {
  var params = new URLSearchParams(window.location.search);
  return params.get(key);
}

function initPlayer() {
  var vId = getParam('v');
  var cId = getParam('c');
  var frame = document.getElementById('ytFrame');
  
  if (!vId && !cId) {
    document.body.innerHTML = '<h2 style="color:#fff;text-align:center;margin-top:20%;">재생할 영상 ID가 없습니다.</h2>';
    return;
  }

  // 버퍼링 방지 및 자동 재생 최적화 옵션 조합
  var opts = [
    'autoplay=1',         // 자동 재생
    'mute=1',             // 음소거 (브라우저 자동재생 차단 회피)
    'controls=0',         // 재생바 및 UI 제거 (불필요한 리소스 차단)
    'rel=0',              // 관련 영상 최소화
    'playsinline=1',      // 전체화면 강제 전환 방지
    'enablejsapi=1',      // JS 제어 허용
    'widget_referrer=' + encodeURIComponent(window.location.href)
  ];

  var src = '';
  if (vId) {
    src = 'https://www.youtube.com/embed/' + vId + '?' + opts.join('&');
  } else if (cId) {
    // 채널 라이브 방송 중계 시
    src = 'https://www.youtube.com/embed/live_stream?channel=' + cId + '&' + opts.join('&');
  }

  frame.src = src;
}

initPlayer();

// 팝업/오류 발생 시 상위 메인 HTML(skyview)로 오류 통보
window.addEventListener('error', function() {
  if (window.parent) {
    window.parent.postMessage({ ytError: 101 }, '*');
  }
});
</script>
</body>
</html>
